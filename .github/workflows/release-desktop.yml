name: Desktop beta release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-beta-release
  cancel-in-progress: false

env:
  NODE_VERSION: 22.19.0

jobs:
  prepare-release:
    name: Open the draft release
    runs-on: ubuntu-latest
    steps:
      # Created up front and left as a draft so the platform builds have
      # somewhere to upload to. Nobody sees it until both have succeeded, which
      # keeps the all-or-nothing behaviour the separate publish job used to give.
      - name: Create the draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-beta.${{ github.run_number }}
        run: |
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --draft \
              --prerelease \
              --title "CoilCoil $TAG" \
              --notes "Automated desktop beta build from ${{ github.sha }}."
          fi

  build-macos:
    name: Build macOS arm64
    needs: prepare-release
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/pi/package-lock.json

      - name: Prepare dependencies and native modules
        run: npm run setup

      - name: Stamp beta version
        run: npm run release:version -- "${{ github.run_number }}"

      - name: Build DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package --workspace @coilcoil/desktop -- --mac --arm64

      - name: Verify macOS app signature
        run: codesign --verify --deep --strict --verbose=2 apps/desktop/release/mac-arm64/CoilCoil.app

      - name: Attach macOS installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-beta.${{ github.run_number }}
        run: gh release upload "$TAG" apps/desktop/release/*.dmg apps/desktop/release/*.zip --clobber --repo "${{ github.repository }}"

  build-windows:
    name: Build Windows x64 and arm64
    needs: prepare-release
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/pi/package-lock.json

      - name: Prepare dependencies and native modules
        run: npm run setup

      - name: Verify bundled node-pty prebuilds
        shell: pwsh
        run: |
          $required = @(
            "node_modules/node-pty/prebuilds/win32-x64/conpty.node",
            "node_modules/node-pty/prebuilds/win32-arm64/conpty.node",
            "node_modules/node-pty/prebuilds/win32-x64/conpty_console_list.node",
            "node_modules/node-pty/prebuilds/win32-arm64/conpty_console_list.node"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing node-pty prebuild: $file" }
          }

      - name: Stamp beta version
        run: npm run release:version -- "${{ github.run_number }}"

      - name: Build NSIS installers and ZIP
        run: npm run package --workspace @coilcoil/desktop -- --win

      - name: Attach Windows installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-beta.${{ github.run_number }}
        run: gh release upload "$TAG" apps/desktop/release/*.exe apps/desktop/release/*.zip --clobber --repo "${{ github.repository }}"

  finalize-release:
    name: Publish the release
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Take the release out of draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-beta.${{ github.run_number }}
        run: gh release edit "$TAG" --draft=false --prerelease --repo "${{ github.repository }}"
