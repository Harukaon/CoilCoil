name: Desktop beta release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-beta-release
  cancel-in-progress: false

env:
  NODE_VERSION: 22.19.0

jobs:
  build-macos:
    name: Build macOS arm64
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/pi/package-lock.json

      - name: Prepare dependencies and native modules
        run: npm run setup

      - name: Stamp beta version
        run: npm run release:version -- "${{ github.run_number }}"

      - name: Build DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package --workspace @suocode/desktop -- --mac --arm64

      - name: Verify macOS app signature
        run: codesign --verify --deep --strict --verbose=2 apps/desktop/release/mac-arm64/SuoCode.app

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows x64 and arm64
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vendor/pi/package-lock.json

      - name: Prepare dependencies and native modules
        run: npm run setup

      - name: Verify bundled node-pty prebuilds
        shell: pwsh
        run: |
          $required = @(
            "node_modules/node-pty/prebuilds/win32-x64/conpty.node",
            "node_modules/node-pty/prebuilds/win32-arm64/conpty.node",
            "node_modules/node-pty/prebuilds/win32-x64/conpty_console_list.node",
            "node_modules/node-pty/prebuilds/win32-arm64/conpty_console_list.node"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing node-pty prebuild: $file" }
          }

      - name: Stamp beta version
        run: npm run release:version -- "${{ github.run_number }}"

      - name: Build NSIS installers and ZIP
        run: npm run package --workspace @suocode/desktop -- --win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish prerelease
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Create or refresh GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-beta.${{ github.run_number }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --prerelease --title "SuoCode $TAG"
          else
            gh release create "$TAG" release/* \
              --target "${{ github.sha }}" \
              --prerelease \
              --title "SuoCode $TAG" \
              --notes "Automated desktop beta build from ${{ github.sha }}."
          fi
