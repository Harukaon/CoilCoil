<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SuoCode Issue 看板</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --panel-2:#fbfbfc;
    --ink:#1c1f24; --ink-2:#5b6472; --ink-3:#8b95a3;
    --line:#e4e7ec; --line-2:#eef0f3;
    --accent:#4f6bed;
    --todo:#9aa4b2; --doing:#3b82f6; --review:#8b5cf6; --reply:#ef4444; --done:#10b981;
    --hi:#e5484d; --mid:#f5a524; --lo:#94a3b8;
    --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme=light]){
      --bg:#15171b; --panel:#1c1f24; --panel-2:#20242a;
      --ink:#e8eaed; --ink-2:#a3adba; --ink-3:#6e7783;
      --line:#2b3038; --line-2:#23272e;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    }
  }
  :root[data-theme=dark]{
    --bg:#15171b; --panel:#1c1f24; --panel-2:#20242a;
    --ink:#e8eaed; --ink-2:#a3adba; --ink-3:#6e7783;
    --line:#2b3038; --line-2:#23272e;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC",system-ui,sans-serif;
  }
  .wrap{max-width:1680px;margin:0 auto;padding:22px 24px 60px}

  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:20px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--ink-3);font-size:12.5px}

  .bar{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 12px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  button,.btn{
    font:inherit;font-size:13px;padding:7px 13px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    cursor:pointer;transition:background .15s,border-color .15s,transform .1s;
  }
  button:hover{background:var(--line-2);border-color:var(--ink-3)}
  button:active{transform:translateY(1px)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{background:#4459d8;border-color:#4459d8}
  .btn-danger{background:transparent;border-color:var(--hi);color:var(--hi)}
  .btn-danger:hover{background:var(--hi);color:#fff}
  .btn-ok{background:var(--done);border-color:var(--done);color:#fff}
  .btn-ok:hover{filter:brightness(.94)}
  .spacer{flex:1}
  input[type=search]{
    font:inherit;font-size:13px;padding:7px 11px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink);min-width:200px;
  }
  .dirty{color:var(--mid);font-size:12.5px;display:none}
  .dirty.on{display:inline}

  .board{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:14px;align-items:start}
  @media (max-width:1200px){.board{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:680px){.board{grid-template-columns:1fr}}

  .col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
       box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:120px}
  .col-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .col-h .name{font-weight:600;font-size:13px}
  .col-h .n{margin-left:auto;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
  .col-b{padding:10px;display:flex;flex-direction:column;gap:9px;min-height:60px}
  .col.over .col-b{background:var(--line-2);border-radius:0 0 var(--radius) var(--radius)}

  .card{
    background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--lo);
    border-radius:11px;padding:11px 12px;cursor:pointer;
    transition:border-color .15s,transform .1s,box-shadow .15s;
  }
  .card:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(16,24,40,.09);border-color:var(--ink-3)}
  .card.p-high{border-left-color:var(--hi)}
  .card.p-medium{border-left-color:var(--mid)}
  .card.dragging{opacity:.4}
  .card .id{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .card .t{font-weight:600;font-size:13px;margin:3px 0 6px;line-height:1.45}
  .card .m{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--ink-2)}
  .chip{background:var(--line-2);border-radius:20px;padding:2px 8px}
  .chip.warn{color:var(--mid)}

  dialog{
    border:none;border-radius:16px;padding:0;background:var(--panel);color:var(--ink);
    max-width:760px;width:calc(100vw - 40px);box-shadow:0 24px 60px rgba(0,0,0,.3);
  }
  dialog::backdrop{background:rgba(10,12,16,.55)}
  .d-h{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line-2)}
  .d-h h2{margin:0;font-size:17px;line-height:1.4;flex:1}
  .d-h .x{border:none;background:transparent;font-size:22px;line-height:1;color:var(--ink-3);padding:2px 6px}
  .d-b{padding:18px 22px;max-height:min(62vh,600px);overflow:auto}
  .d-f{display:flex;gap:8px;padding:14px 22px;border-top:1px solid var(--line-2);flex-wrap:wrap}

  .body-text{white-space:pre-wrap;color:var(--ink-2);background:var(--panel-2);
             border:1px solid var(--line-2);border-radius:11px;padding:12px 14px;font-size:13px}
  .sec{margin-top:20px}
  .sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:0 0 9px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2)}
  select,textarea,input[type=text]{
    font:inherit;font-size:13px;padding:7px 10px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  }
  textarea{width:100%;min-height:82px;resize:vertical;line-height:1.6}

  .note{border:1px solid var(--line-2);border-left:3px solid var(--accent);
        border-radius:10px;padding:10px 12px;margin-bottom:9px;background:var(--panel-2);font-size:13px}
  .note.mine{border-left-color:var(--done)}
  .note .h{display:flex;gap:8px;font-size:11px;color:var(--ink-3);margin-bottom:5px}
  .note .h b{color:var(--ink-2);font-weight:600}
  .note .c{white-space:pre-wrap;color:var(--ink-2)}
  .note img{max-width:100%;border-radius:9px;margin-top:9px;display:block;cursor:zoom-in;border:1px solid var(--line)}
  .note .del{margin-left:auto;border:none;background:transparent;color:var(--ink-3);font-size:11px;padding:0 3px;cursor:pointer}
  .note .del:hover{color:var(--hi)}
  .empty{color:var(--ink-3);font-size:12.5px;padding:2px 0}
  .drop{border:1px dashed var(--line);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--ink-3);margin:9px 0}
  .drop.over{border-color:var(--accent);color:var(--accent)}
  .thumbs{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
  .thumb{position:relative}
  .thumb img{height:52px;border-radius:8px;border:1px solid var(--line);display:block}
  .thumb button{position:absolute;top:-6px;right:-6px;width:19px;height:19px;padding:0;border-radius:50%;
                background:var(--hi);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer}
  code{background:var(--line-2);padding:1px 5px;border-radius:5px;font-size:12px;
       font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .hint{color:var(--ink-3);font-size:12px;margin-top:10px;line-height:1.65}

  /* 管控日志：这一轮谁在做什么、我替用户做了哪些决定 */
  .mgr{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:0 14px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .mgr>summary{
    cursor:pointer;list-style:none;padding:11px 0;font-size:13px;color:var(--ink-2);
    display:flex;align-items:center;gap:8px;
  }
  .mgr>summary::-webkit-details-marker{display:none}
  .mgr>summary::before{content:'▸';color:var(--ink-3);transition:transform .15s}
  .mgr[open]>summary::before{transform:rotate(90deg)}
  .mgr>summary b{color:var(--ink);font-weight:600}
  .mgr-b{border-top:1px solid var(--line-2);padding:4px 0 14px}
  .mgr-i{padding:11px 0 0}
  .mgr-i+.mgr-i{border-top:1px dashed var(--line-2);margin-top:11px}
  .mgr-i .h{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
  .mgr-i .h b{font-size:13px}
  .mgr-i .h span{color:var(--ink-3);font-size:11.5px}
  .mgr-i .c{color:var(--ink-2);font-size:12.5px;white-space:pre-wrap;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SuoCode Issue 看板</h1>
    <span class="sub" id="meta"></span>
    <span class="spacer"></span>
    <span class="dirty" id="dirty">● 有未导出的改动</span>
  </header>

  <div class="bar">
    <button class="btn-primary" id="new">＋ 新建 Issue</button>
    <input type="search" id="q" placeholder="搜索标题 / 正文 / 模块…">
    <select id="fArea"><option value="">全部模块</option></select>
    <span class="spacer"></span>
    <button id="export">⬇ 导出 tasks.json</button>
    <button id="reset">↺ 丢弃本地改动</button>
    <button id="theme">◐ 主题</button>
  </div>

  <details class="mgr" id="mgr" hidden>
    <summary><b>管控日志</b><span id="mgrN"></span></summary>
    <div class="mgr-b" id="mgrB"></div>
  </details>

  <div class="board" id="board"></div>

  <p class="hint">
    卡片可直接拖到别的列改状态，点开可以改状态 / 打回 / 通过、回复文字和贴图（支持 <code>Ctrl/⌘+V</code> 粘贴截图）。<br>
    你的改动实时存在浏览器 localStorage 里；点「导出 tasks.json」下载后覆盖 <code>docs/taskboard/tasks.json</code>，我这边就能读到你的回复。
  </p>
</div>

<dialog id="dlg">
  <div class="d-h">
    <h2 id="dTitle"></h2>
    <button class="x" id="dClose" aria-label="关闭">&times;</button>
  </div>
  <div class="d-b" id="dBody"></div>
  <div class="d-f" id="dFoot"></div>
</dialog>

<script>
const SEED = {
  "meta": {
    "source": "docs/requirements-2026-08-29.md",
    "createdAt": "2026-08-29",
    "note": "agent 只写 agentNotes / commits / status；userComments 由看板导出写回，agent 不覆盖。",
    "decisions": [
      {
        "at": "2026-08-28T20:32:20.902405Z",
        "title": "接手情况：Mac 上那个会话没有留下任何进度",
        "text": "看板骨架（29 个 Issue、HTML 页面、结果合并脚本）是有的，但 29 个 Issue 全部还是「待办」，一行产品代码都没改。所以这一夜是从零开始跑的，不是接着改。"
      },
      {
        "at": "2026-08-28T20:32:20.902405Z",
        "title": "你想不起来的那个 w 开头的词 = git worktree",
        "text": "就是它。一个仓库可以同时检出好几份工作副本，各自在自己的分支上，互不干扰。3 个 agent 各占一份，改完我再逐个合回 main。"
      },
      {
        "at": "2026-08-28T20:32:20.902405Z",
        "title": "worktree 放在仓库内部的 .worktrees/ 下",
        "text": "因为这个仓库是「一份文件、两个路径」：Mac 上是 /Users/hao/Desktop/project/SuoCode，我干活的 Ubuntu 虚拟机里是挂载出来的 /home/hao/Workspace/SuoCode。放到仓库外面，虚拟机这边就看不见了。\n\n干净的 worktree 没有依赖包，tsc 和测试跑不起来，所以：node_modules 用软链指回主仓库（省几个 G），dist 构建产物是复制的（软链的话三个 agent 会互相覆盖）。"
      },
      {
        "at": "2026-08-28T20:32:20.902405Z",
        "title": "分工规则：改文件在虚拟机，跑命令在 Mac",
        "text": "依赖包是 Mac 原生编译的（esbuild / electron / node-pty），在 Linux 里根本执行不了。所以 agent 在虚拟机里改代码，所有 git / 编译 / 测试都通过 ssh 回到你的 Mac 上跑。包了个 docs/taskboard/mac.sh 脚本，免得每个 agent 自己拼命令拼错。"
      },
      {
        "at": "2026-08-28T20:32:20.902405Z",
        "title": "测试隔离策略（这是你让我定的那件事）",
        "text": "三个 agent 同时在你这一台 Mac 上跑，共享的东西必须约束死：\n\n① 每个 agent 只跑自己改到的那个包的 tsc + 单元测试，不跑全仓库，否则三个人互相拖慢。\n② 禁止 agent 打包整个 app（npm run package / smoke）——会抢 electron-builder 缓存和调试端口。端到端冒烟改成由我在合并到 main 之后串行跑一遍。\n③ 绝对禁止碰 ~/Library/Application Support/@coilcoil/desktop/ —— 那是你正在用的 CoilCoil 的真实会话和设置。需要 app 数据目录的一律用临时目录（仓库里现成的冒烟脚本本来就是这么做的）。\n④ 禁止 npm run dev（会弹出真窗口抢你的桌面）、禁止 git push、禁止动别人的 worktree。\n\n结论：你正在用的那个 CoilCoil 全程不会被动到。"
      },
      {
        "at": "2026-08-28T20:32:20.902405Z",
        "title": "每轮 3 个 agent，按「改到的文件不重叠」分组",
        "text": "你说每轮 3 个，就 3 个。分组不是按优先级随便切的，是按会动到哪些文件切的——比如所有调色/圆角/滚动条这类只改样式变量的 Issue 会放在同一个 agent 手里，不然两个人同时改一份 CSS，合并的时候必冲突。\n\n每轮结束我负责把三个分支合回 main、解冲突、串行跑一遍端到端冒烟，然后开下一轮。"
      },
      {
        "at": "2026-08-28T20:32:20.902405Z",
        "title": "第 1 轮分工",
        "text": "r1a → #1 终端强制贴底 + 长时间渲染错乱（最硬的一个，单独给一个 agent）\nr1b → #5 标题栏拖不动（老大难，要求查到根因、给结构性方案，不许再打补丁）\nr1c → #8 #18 两个提问 + #9 删子 agent 提示词 + #14 检查左下角 logo（都是轻活，凑成一份）"
      },
      {
        "at": "2026-08-28T20:38:51.157096Z",
        "title": "第 1 轮 r1c 已合并 —— 顺带发现一件需要你拍板的事",
        "text": "#9 让我删掉系统提示词里的子 Agent 段落，已经删了。但 agent 在排查时发现：子 Agent 这个**工具本身其实还是开着的**，只有 plan 被隐藏了。它是在之前一次「按 profile 配置子 Agent 模型」的改动里被从隐藏名单里移出去的。\n\n所以现在的状态是：提示词不再鼓励模型去委派，但模型真想调还是调得到。\n\n我**没有**顺手把它关掉——「删掉提示词」和「停用工具」是两件事，你当初把它藏起来是打算按 oh-my-pi 的思路重写之后再放开，那次移出隐藏名单到底是有意的还是漏的，只有你知道。要彻底停用的话回我一句，我下一轮加个 Issue 处理。"
      },
      {
        "at": "2026-08-28T20:51:46.620768Z",
        "title": "第 1 轮全部合并完成，main 上 278 个测试全绿",
        "text": "#1 终端、#5 标题栏拖动、#8/#9/#14/#18 都进 main 了。合并后我在 main 上重新跑了一遍编译和单测，278/278 通过。\n\n#5 那个 agent 把三个「为什么」都答出来了：左上角之所以从来没坏过，是因为那块是一个**完全空的**拖动方块，没有任何东西压在上面；chat 和右侧栏是把拖动属性写在标题栏元素本身上，而标题栏里塞着标题、按钮、标签条。右侧栏多开标签后失效是纯几何——标签条的最大宽度和右边按钮占的宽度加起来超了，中间能按住的空带被压到 12px。「随便 resize 一下就好」说明真正漏掉的不是某条 CSS，而是**什么时候让系统重算可拖动区域**。所以这次不是再补一条 CSS，是统一成一个铺满的拖动层组件 + 指针进标题栏就强制重算一次。"
      },
      {
        "at": "2026-08-28T20:51:46.620768Z",
        "title": "第 2 轮分工（已派出）",
        "text": "r2a → #3 浏览器标签页改到顶部 + #29 中键关标签 + #2 首屏卡顿（三个都在浏览器/标签条这一块，给同一个人，免得抢文件）\nr2b → #4 文件面板支持编辑 + #12 skill 启用标志\nr2c → #23 设置界面配色不同步 + #20 字体切换 + #10 返回按钮\n\n给 r2b 和 r2c 下了避让约定：r2a 这一轮拥有 InspectorPane 和 browser 目录，另外两个非必要不许动，必须动就做最小改动并报告，我合并时重点看。"
      },
      {
        "at": "2026-08-28T20:51:46.620768Z",
        "title": "#4 文件编辑，几个我替你定的细节",
        "text": "你只说了「支持编辑 md txt json jsonl 等等，预览状态下不可编辑」，剩下的我替你定了：\n\n· 有明确的两态——点「编辑」才进编辑态，不是点一下就能改内容；\n· 超过 2MB 的文件只读，二进制和图片挡住；\n· ⌘S 保存，有未保存改动切走会拦一下；\n· 写盘用原子写（先写临时文件再改名），避免把你的文件写坏；\n· 文件在磁盘上被别人（比如 agent 自己）改过会检测到并提示，不直接覆盖；\n· JSON/JSONL 保存前先校验语法，坏了提示而不是写进去；\n· 不引入 Monaco/CodeMirror 这类重型编辑器，保持轻量。\n\n不满意的话在 #4 底下回我，下一轮改。"
      },
      {
        "at": "2026-08-28T20:51:46.620768Z",
        "title": "#20 字体，我限定了只用系统自带字体",
        "text": "不打包也不下载字体文件（体积和授权都麻烦）。备选是系统默认、无衬线、衬线、等宽这几档，每一档都配完整的 fallback，并且中文一定落到苹方，免得选了英文字体之后中文掉到难看的兜底字体上。另外让它尽量把「界面字体」和「代码/终端等宽字体」分成两个独立选项。"
      },
      {

          "text": "根因（第一个问题：强制贴底）\n终端面板过去把 shell 的全部输出攒成一个长字符串放在界面状态里，最多留 50 万字符；每来一段新输出，就拿新字符串和已经画在屏幕上的比一下，只补画多出来的那一截。问题出在超过 50 万字符之后：前面的内容会被砍掉，\"新的以旧的开头\"这个判断就再也不成立了，于是程序改走另一条路——把整个终端清空、把 50 万字符从头重画一遍，而且是每来一小段输出就干一次。清空终端会顺手把 xterm 自己记着的\"用户正在往上翻\"这个状态抹掉，画面因此被拽回底部。claude code 这种全屏界面刷新极频繁，几分钟就能把缓冲撑满，之后就变成你看到的\"每次刷新都强制滚到底\"。\n\n现在的行为\n输出不再进界面状态，直接交给终端本体，滚动完全由终端自己管：你本来停在底部就继续跟着新内容走，你往上翻了就待在原地不动，新输出照常进历史但不动画面——和 VSCode 终端一致。你自己敲键盘时仍然会跳回底部（这也是标准行为）。\n\n第二个问题：跑久了渲染错乱\n同一个根因大概率就是主凶。清空重画是立刻生效的，但排队等着解析的那段数据还在继续往里灌，解析很容易停在半个转义序列上，画面就花了；而且被砍掉 50 万字符之后剩下的开头，经常正好落在某个颜色或光标转义序列的中间，重画时这半截序列会污染后面所有内容。这次顺带把几处相关隐患一并处理了：\n1. 彻底去掉\"清空重画\"这条路；\n2. 主进程留给面板重放的那份历史，现在保证从完整的一行开始，不会从半个转义序列开始；\n3. 主进程原来每收到一段输出都要重建一遍 50 万字符的字符串（全屏界面下一秒几十次），长时间运行会明显拖慢主进程、拖慢输出到达界面的速度，现在改成按块保存、需要时才拼一次；\n4. 拖动分割条改终端大小时，原来每一帧都通知一次 shell 改尺寸，全屏界面会被迫一帧一个宽度地重画，很容易画花；现在同一帧只发一次，尺寸没真变就不发；\n5. 切走的终端标签页是隐藏状态，切回来时多补一次重绘，避免看到上一次残留的画面。\n\n排除掉的嫌疑（有代码依据，不是猜的）\n- 不是显卡渲染插件的问题：这个终端根本没装 WebGL/Canvas 渲染插件，只装了自适应大小的插件，所以\"纹理图集失效\"这条不成立。\n- 不是历史行数上限的问题：上限是 1 万行，是正常值。\n- 不是多处并发写入打架：写入本来就只有一个入口，终端内部还有自己的写入队列。\n\n没搞定 / 需要你配合的\n这一轮不允许打包和启动应用，所以我没法真的把 app 开着跑几小时看结果。第一个问题（强制贴底）的成因是确定的、也被单测锁住了；第二个问题（渲染错乱）我有很强的证据认为是同一个根因，但不能 100% 保证根除。请你实际用一段时间；如果还会花屏，麻烦告诉我三件事：出问题前是不是刚拖过窗口或分割条、是不是刚从别的标签页切回终端、以及花的是整屏还是只有某几行错位——这三条能直接把剩下的嫌疑分开。\n\n验证\ndesktop 包类型检查通过；desktop 包 272 个单测全部通过，其中新增 7 个专门盯这件事的测试，包括\"用户往上翻之后再来两万行输出，画面必须待在原地不动\"。没有改到其它包，所以没有跑其它包的测试。"

          "text": "【现在怎么用】右侧文件面板打开一个文本文件（md、txt、json、jsonl、yaml、toml、ini、csv、log、没有扩展名的纯文本都行），预览区右上角会多一个「编辑」按钮。点它才进入编辑态；不点就还是老样子的只读预览——你说的「预览状态下不可编辑」是按这条做的，预览里永远打不了字。\n\n进入编辑态后中间变成一块可以直接打字的白色区域。改完有两个出口：「保存」（也可以按 ⌘S）写回磁盘并退回预览；「取消」退出编辑。如果已经改过东西还点取消，按钮会先变成红色的「确认放弃」，再点一次才真丢弃——不会一下手滑就没了。\n\n【哪些文件不给编辑，为什么】\n1. 图片、PDF：根本不出现「编辑」按钮。\n2. 超过 2 MB 的文件：只读，底部会写明原因。因为预览本来就只读了前 2 MB，如果允许保存，等于把文件后半截删掉。\n3. 看着像文本、其实是二进制的文件（比如后缀是 .log 但内容是压缩包）：只读，底部写明原因。\n4. 不在当前项目文件夹里的文件（Agent 回复里引用的外部路径也能打开预览）：只读。查看可以到处看，写只允许写在工作区里面，这是防止界面被拿去改任意路径的文件。\n\n【不会弄坏文件的几道保险】\n1. 写盘是「原子写」：先写一个同目录下的隐藏临时文件，再整体替换过去。中途断电或出错，原文件保持原样，不会出现写了一半的残缺文件。文件权限也照抄原文件。\n2. 保存 json / jsonl 之前先做语法检查，写错了会提示（jsonl 还会告诉你是第几行坏了），并且不写盘。允许带注释的 .jsonc 不做严格检查。\n3. 编辑期间如果这个文件在磁盘上被别人改了（最常见的是 Agent 自己在改），顶部会跳出一条黄色提示，让你选「用磁盘上的版本」还是「保留我的修改」，绝不会闷头覆盖。就算提示没来得及显示，保存时后台还会再比对一次文件时间戳，对不上就直接拒绝保存并提示。\n4. 有未保存的修改时去点别的文件、或者关掉预览，会被拦下并提示「请先保存或取消编辑」，不会静默丢弃。\n\n【顺带修好的】.jsonl / .ndjson / .properties / .cfg 以前在文件面板里压根打不开（提示不支持预览），现在能预览也能编辑了。\n\n【做了什么取舍】没有装 Monaco / CodeMirror 这类编辑器，就是一块普通文本框，所以没有语法高亮、没有自动缩进、Tab 键仍然是切换焦点而不是插入缩进。理由是这个面板的定位是改几行配置和笔记，为此多背一个几 MB 的依赖不划算，也和项目现有的轻量风格不符。如果以后想要高亮，可以再单独提一个 Issue。\n\n【自动化验证】新增 20 条单测（可编辑类型判定、2 MB 上限、二进制识别、JSON/JSONL 语法检查、原子写落地后目录里不留临时文件、时间戳冲突时拒绝覆盖、工作区外拒写、外部改动的两种处理）。desktop 包 tsc 与全部单测通过：299 passed / 0 failed（基线 278，本次 +20，#12 再 +1）。\n\n【打包后请这样人工验一遍】\n1. 打开一个项目，在右侧文件面板点开一个 .md：确认右上角有「编辑」，点进去能打字，改一句，按 ⌘S，提示「已保存 xxx.md」，用别的编辑器打开确认内容真的变了。\n2. 打开一个 .json：故意删掉一个大括号再保存，应当报「JSON 语法有误」且文件没被改坏；补回去再保存应当成功。\n3. 打开一个 .jsonl：把某一行改成非法 JSON 保存，提示里应当带行号。\n4. 外部改动：进入编辑态后不要保存，让 Agent（或在终端里用命令）改同一个文件，等一两秒，顶部应当出现黄条；分别试「用磁盘上的版本」（内容被换成磁盘版本）和「保留我的修改」（内容保留、再保存能成功）。\n5. 未保存拦截：改了字不保存，去点文件树里另一个文件，应当被拦住并提示；点「取消」→「确认放弃」后再点，就能正常切走。\n6. 只读场景：打开一张图片（无编辑按钮）、打开一个超过 2 MB 的日志（无编辑按钮，底部说明超过 2 MB）。\n7. 从对话里点一个项目外的绝对路径（比如 /etc/hosts）打开预览：能看，但不给编辑按钮，底部写「文件不在当前项目内」。"
        }

      "title": "标题栏拖动在特定情况下失效",
      "body": "修过很多遍了，特定情况下仍然无法拖动，非常恼火。失效后随便调整一下窗口大小、或者去左侧上方拖两下就恢复。左侧上方那块拖动 100% 有效，chat 界面上方失效，右侧栏在多开几个标签页后拖动效果也没了。查清左侧为什么必然有效、另外两处为什么会丢。",
      "area": "窗口",
      "priority": "high",
      "status": "review",
      "agentNotes": [
        {
          "by": "r1b",
          "at": "2026-08-29T00:00:00.000Z",
          "text": "先回答三个「为什么」。\n\n【为什么左上角 100% 有效】那一块是一整块空的拖动带：`.sidebar-drag` 里只放了一个什么都没有的方块，宽度还特意躲开了右边 50px（收起侧栏那个按钮就在那 50px 里）。也就是说，那块拖动区上面永远不会压着任何按钮，尺寸也只在拉侧栏宽度时才变。chat 和右侧栏不一样：那两处是「把标题栏本身设成可拖动」，标题栏里同时还塞着标题、按钮、标签条，谁长大一点就吃掉一块拖动区。\n\n【为什么右侧栏多开几个标签就拖不动】这条是纯几何、和玄学无关，看 CSS 就能算出来：标签条最多允许占到「整条标题栏减 80px」，可是右边那两个按钮 + 左右内边距 + 间距本身就要 92px。标签一多，标签条顶到上限，中间那条真正能按住拖窗的空带被压到只剩 12px（CSS 里写死的最小值），再多还会把右上角按钮顶出可视区。12px 那么细，人是按不中的，看起来就是「拖动效果没了」。\n\n【为什么 chat 上方会丢、随便 resize 一下又好了】这条是 Electron/Chromium 的老毛病：可拖动区域不是实时算的，Chromium 只在「某个元素的 app-region 属性值发生变化」时才重新收集一遍矩形清单，然后交给 macOS。矩形只是移动、变大变小（面板拉宽、标题多一行、窗口变高），或者一个曾经在标题栏上「挖过洞」的浮层（弹出菜单、右键菜单、提示气泡）被关掉，都不会触发重算——旧清单就一直用着，那块区域按下去当然没反应。resize 窗口会顺带触发一次重算，所以「随便调一下窗口大小就好了」。这也说明它不是 CSS 写漏了，之前几次修复给某个元素补 CSS 之所以治不干净，就是因为漏的是「什么时候重算」，不是「哪里少写了一条」。\n\n【这次改成什么结构】不再逐个元素打补丁，改成一条统一约定：\n1. 每条标题栏都由同一个组件（WindowDragBar）铺一层「空的拖动层」，铺满整条标题栏、里面什么都不放，而且必须放在标题栏的第一个位置——这样后面的按钮会自动在它上面挖出自己的洞，新加的 UI 也不会再把整条拖动带盖掉。左上角那块之所以一直好用就是这个形状，现在 chat、右侧栏、技能页、记忆页全部统一成它。\n2. 右侧栏给拖动带留了一段永远不会被标签占掉的空位（48px），标签条超出就横向滚动，右上角按钮也不会再被顶出去。这笔账（48+62+14+16=140）写进了测试，以后谁改其中一个数字，测试会当场报错。\n3. 最关键的一条：鼠标一移进任何一条标题栏，就主动让系统重算一次可拖动区域。系统是在你按下鼠标那一刻才去查的，而按下之前鼠标一定先移进来，所以这一下永远赶得上；鼠标不在标题栏时完全没有开销。重算用的是一个 0×0 的隐形哨兵元素，不会有哪怕一帧让真正的拖动带失效（旧写法是把标题栏自己临时关掉再打开，那一帧里按下去反而拖不动）。\n\n【怎么验】打包后的 app 里：\n1. chat 界面上方空白处按住拖窗口，来回拖十几次；中途开关左右侧栏、切几个会话、让标题变长/变短、随便右键点几下侧栏的会话（弹出菜单开了再关），再回去拖——应该每次都能拖动。\n2. 右侧栏连开 4~6 个标签页（终端、浏览器、文件等），看标签条右边是否始终留着一小段空白，在那段空白上按住拖窗口应该有效；同时右上角的「+」和「收起右侧栏」两个按钮不能被挤出去。\n3. 左上角那块照旧应该 100% 有效（这次也换成了同一个组件，要确认没有退化）。\n4. 技能页、记忆页的标题栏也顺手拖一下。\n5. 顺便确认标题栏里的按钮还都点得动（展开侧栏、展开作业栏、标签页的关闭叉、右侧栏的 + 和收起）——拖动层是铺在它们下面的，这一条是防止盖住点击。\n\n【留的口子】窗口里那两条拉宽面板的竖条（panel-resizer）在标题栏高度范围内本来就按不动（会变成拖窗口），这是改动之前就有的，和本次问题无关，没顺手动它以免影响别的行为。"
        }

          "at": "2026-08-29T05:00:00.000Z",
          "text": "结论：没有「多少轮自动整理」这个设置。记忆整理不是按轮数攒够了才跑，而是**每次回答彻底结束就跑一次**，并且默认是开着的。\n\n具体是这样：\n1. 触发点：主 Agent 一轮跑完、并且确定不会再自动重试 / 自动压缩 / 继续跑排队消息之后，会发一个「已收尾」的信号，记忆整理就挂在这个信号上。代码在 packages/workflow/extensions/project-memory.ts 第 407-411 行（监听 agent_settled）。所以口语说就是「你每问一次、它答完一次，就整理一次」，没有 3 轮 / 5 轮这种阈值，也没有 token 阈值或上下文占比阈值。\n2. 默认值：开启。配置文件里没写这一项时按开启算，代码在 packages/workflow/extensions/memory-settings.ts 第 62 行（autoSummarize），运行时另有一份同样默认值在 packages/runtime-core/src/runtime-resources.ts 第 107 行。\n3. 你可以改：设置里的「记忆」页有一个勾选框「回复后自动整理」（apps/desktop/src/renderer/src/features/memory/MemoryWorkspace.tsx 第 242 行）。取消勾选后就完全不自动跑，只能手动敲 /memory。\n4. 实际不会疯狂重复跑，有三道闸：\n   - 同一个项目同一时刻只允许有一个整理进程，靠一个锁文件挡住（packages/workflow/extensions/memory-worker.ts 第 54 行起；锁超过 15 分钟没人释放才算失效）。上一次还没整理完就又答完一轮的话，这一次直接跳过，界面上显示「当前项目已有记忆整理正在运行」。\n   - 单次整理最多跑 5 分钟，超时被杀（memory-worker.ts 第 9 行）。\n   - 工作目录如果在 .pi 里面，直接禁用整理，防止自己整理自己。\n5. /memory 这个命令本身做的事：立刻在后台启动一次同样的整理（project-memory.ts 第 314-323 行），跟自动触发走的是同一套流程，只是会给你一条「记忆整理已在后台启动」的提示。\n6. 设置文件真实位置：~/Library/Application Support/@coilcoil/desktop/agent/memory-settings.json。里面 autoSummarize 为 false 就是关，缺省或 true 就是开。\n\n一句话：默认「每答完一次就整理一次」，不是按轮数，且可以在设置里一键关掉。"

          "text": "做了什么：把系统提示词里那一整段介绍「子 Agent 委派」的内容删掉了。\n\n被删的是 packages/workflow/extensions/system/engineering-standards.ts 里标题为「Subagent delegation and context management」的一节，一共 5 条：叫模型优先考虑委派、主 Agent 只管主线、把支线任务派出去、支线任务包括哪些、以及提醒子 Agent 看不到主会话上下文。其余内容（执行与沟通、什么时候该问用户、Git 安全、改完代码怎么验证）一条没动。\n\n为什么只动这一处：我把提示词的组装链路整个走了一遍。CoilCoil 的系统提示词 = Pi 的原始提示词，经 packages/workflow/extensions/default-tools.ts 处理后，把 Pi 原来的「Available tools」清单和「Guidelines」整段替换成我们自己的这份 engineering-standards.ts，再由记忆扩展在后面追加项目记忆和全局记忆。所以：\n- subagent 工具自己带的那 6 条使用建议（写在 packages/workflow/extensions/subagents.ts 里）本来就落在 Pi 的 Guidelines 段里，而那一整段在拼装时会被我们整体换掉，根本到不了模型眼前，属于死文本，这次没有动它，也不影响。\n- vendor/pi 里的原始提示词模板（vendor/pi/.../core/system-prompt.ts）本身没有任何子 Agent 字样。\n- packages/workflow/agents/ 下的 explore.md / reviewer.md / worker.md 里有「子 Agent」字样，但那是子 Agent 自己启动时读的角色设定，不是主 Agent 的系统提示词，不能删。\n\n需要向你说明的一个发现（我自己拍板没有改）：任务背景里说 plan 和 subagent 两个工具都已经对 Agent 隐藏，但代码里现在只隐藏了 plan 一个——packages/runtime-core/src/runtime-constants.ts 第 68 行的隐藏名单只剩 [\"plan\"]，subagent 是在提交 eb990bd03（按 profile 配置子 Agent 模型）里被从名单里拿掉的，也就是说 subagent 工具目前仍然对 Agent 开放。既然如此，删掉这段提示词的效果是：模型仍然能调用 subagent 工具（工具的名字和说明是随工具定义走的，不在系统提示词里），只是不再被系统提示词主动鼓励去委派。这符合本次的要求「删掉系统提示词里的子 agent 提示词」。如果你其实是想让 subagent 彻底不可用，那要做的是把它加回那份隐藏名单，这属于另一个改动，我没有顺手做。\n\n验证：@coilcoil/workflow 的类型检查通过；单元测试里唯一失败的是已知会偶发失败的终端测试（terminal-cleanup），单独重跑 18 项全过，与本次改动无关。提示词相关的 default-tools 测试 8 项全过。"

      "id": 18,
      "title": "【提问】会话文件现在存在哪里、能否按文件夹区分？",
      "body": "回答：我们的会话现在是怎么放的，统一放到 coilcoil 的内置目录下面吗？如果我有文件夹 A 和文件夹 B，它们的会话我能在文件里面区分吗？这是提问，给出确切的存储路径与区分方式。",
      "area": "问答",
      "priority": "low",
      "status": "review",
      "agentNotes": [
        {
          "by": "r1c",
          "at": "2026-08-29T05:00:00.000Z",
          "text": "结论：所有会话都放在 CoilCoil 自己的目录下，而且是**一个大平铺目录**，不按文件夹分子目录；文件夹 A 和文件夹 B 的会话靠的是每个会话文件**第一行里的 cwd 字段**来区分，不是靠路径。\n\n1. 存储根目录（macOS 真实路径）：\n   ~/Library/Application Support/@coilcoil/desktop/sessions\n   这是主进程写死的（apps/desktop/src/main/index.ts 第 301 行，把它作为 COILCOIL_SESSION_DIR 传给运行时）。同级还有 agent/（模型、认证、设置）等目录。\n\n2. 目录结构：sessions/ 下面就是一堆 .jsonl 文件平铺，没有按项目分文件夹。唯一的例外是 sessions/subagents/<父会话 id>/，那是子 Agent 自己的会话（packages/workflow/extensions/subagents/child.ts 第 16、100-103 行）。\n\n3. 单个会话文件的命名：<创建时间戳>_<会话 id>.jsonl，时间戳里的冒号和点都换成了短横线，会话 id 是 uuidv7。例如：\n   ~/Library/Application Support/@coilcoil/desktop/sessions/2026-08-29T04-12-33-123Z_0198f2ac-7c31-7a10-9b6e-4f0c1d2e3a55.jsonl\n   （规则在 vendor/pi/packages/coding-agent/src/core/session-manager.ts 第 953 行。）\n\n4. 靠什么区分工作区：每个 .jsonl 的第一行是会话头，里面有 cwd 字段，记着这个会话属于哪个目录。列表界面按「当前工作区路径 == 会话头里的 cwd」来筛（session-manager.ts 第 630-632 行的精确匹配，以及 list 方法）。也就是说：\n   - 不是子目录区分；\n   - 不是路径 hash 区分；\n   - 就是文件里的一个 cwd 字段。\n   所以你想在文件层面区分 A 和 B，直接看每个 .jsonl 的第一行、或者 grep 那个路径就行。举例第一行长这样（省略后面的内容）：\n   {\"type\":\"session\",\"version\":...,\"id\":\"0198f2ac-...\",\"timestamp\":\"2026-08-29T04:12:33.123Z\",\"cwd\":\"/Users/hao/Desktop/project/A\"}\n\n5. 顺带说明：因为是平铺 + cwd 字段决定归属，所以「把一个会话移动到另一个工作区」在实现上就是改写第一行的 cwd，文件名和会话 id 都不变（packages/runtime-core/src/session-relocation.ts）。这也是为什么不做成子目录——做成子目录的话每次移动都要搬文件、还会打乱按会话路径记录的置顶/归档状态。\n\n6. 注意匹配是**精确路径**匹配：A 的子目录 A/sub 会被当成另一个工作区，不会显示在 A 的会话列表里。\n\n（另外，项目记忆是另一套目录，按项目名分文件夹放在 agent/memory/<项目名>/ 下，和会话文件不是一回事。）"
        }

          "text": "【能改，已经做好了】设置 → 外观，拉到最下面，新增两组：「界面字体」和「代码字体」。分成两组是因为它们管的事不一样——一个是正文读起来舒不舒服，一个是代码对不对得齐，多数人这两处想要的不是同一个字体。\n\n【界面字体四档】\n· 系统默认——现在这个样子，macOS 上是苹果的 SF Pro 配苹方，不选就是它；\n· 无衬线——Helvetica Neue，字形比默认窄一点；\n· 衬线——西文用 Iowan Old Style，中文用宋体，长文读着更像书；\n· 等宽——整个界面都用等宽字体，中文仍然是苹方。\n\n【代码字体四档】SF Mono（现在用的，默认）、Menlo（字腔更开，小字号下 0 和 O 好分）、Monaco（笔画偏粗）、PT Mono（偏窄，一行能多放几个字符）。它管的是代码块、文件路径、命令输出、终端这些要对齐的地方。\n\n【几个决定，我自己拍的】\n· 只用 macOS 自带的字体，不打包也不下载字体文件——体积和授权都不值当，这也是任务里点名的要求；\n· 每一档都配了完整的备选链，中文一律落到苹方（衬线那一档落到宋体）。不这么做的话，选一个只有西文的字体，中文会掉到系统随手挑的字形上，中英混排会很难看；\n· 卡片上的示例文字是用那一档的字体真画出来的（西文 + 中文各一行），所以选之前就能看出区别；\n· 选择存在本机，和明暗、色调、层次是同一套存法，重开 app 还在。\n\n【一个已知的小限制】终端的字体不走界面那一套（它是另一个渲染器，只认启动时给它的字体），所以换了代码字体之后，已经开着的终端标签还是旧字体，关掉重开一个就是新的。要做到当场立刻换，得改终端的渲染代码——那部分这一轮由另一个 agent 在重写，我只加了一行去读选中的字体，没有再往里动。\n\n【还有一处没跟上】文件预览面板的等宽字体这次没改（那块归同一轮的另一个 agent 在动，避免撞车），合并之后补一行就行，管控方那边我已经点名了。\n\n【打包后怎么人工验】\n1. 设置 → 外观 → 界面字体，四档逐个点一遍：点下去整个界面（含设置界面自己）应该当场换字体，卡片上的示例和实际效果要对得上。特别看「衬线」那一档，中文要变成宋体而不是变成某种奇怪的字形。\n2. 界面字体切到「衬线」，退回工作区，看看会话里的中文、按钮文字、侧栏会话名是不是都换了。\n3. 设置 → 外观 → 代码字体，切到 Menlo：回工作区找一段代码块 / 一条文件路径 / 一段命令输出，字形应该变了；再新开一个终端标签，终端里也应该是 Menlo（老终端标签不变，属于已知限制）。\n4. 完全退出 app 再打开：刚才选的两档字体应该都还在，并且开屏时不应该看到字体闪一下再变。\n5. 顺手看一眼 MCP 页的 JSON 编辑框、模型页的密钥输入框这些等宽的地方，有没有哪里漏掉还是旧字体。"

const BUILT_AT = "2026-08-29T02:46:31.448Z";
const LS = 'suocode-taskboard-v2';

const COLS = [
  {k:'todo',    name:'待办',   c:'var(--todo)'},
  {k:'doing',   name:'进行中', c:'var(--doing)'},
  {k:'review',  name:'待验收', c:'var(--review)'},
  {k:'reply',   name:'待回复', c:'var(--reply)'},
  {k:'done',    name:'已完成', c:'var(--done)'},
];
const STATUS_NAME = Object.fromEntries(COLS.map(c=>[c.k,c.name]));
const PRIO_NAME = {high:'高',medium:'中',low:'低'};

let state = load();
let openId = null;
let pendingImgs = [];

/* ---------- 存取 ---------- */
function load(){
  try{
    const raw = localStorage.getItem(LS);
    if(raw){
      const saved = JSON.parse(raw);
      // 以 SEED 为骨架合并，这样我新增/改写任务后你的回复不会丢
      const byId = new Map((saved.tasks||[]).map(t=>[t.id,t]));
      const merged = SEED.tasks.map(seed=>{
        const mine = byId.get(seed.id);
        if(!mine) return structuredClone(seed);
        return {...structuredClone(seed),
          status: mine.status ?? seed.status,
          userComments: mine.userComments ?? [],
          // agent 侧字段始终以 SEED 为准
        };
      });
      // 你在看板上自己新建的 Issue（SEED 里没有的）保留
      for(const t of saved.tasks||[]) if(!SEED.tasks.some(s=>s.id===t.id)) merged.push(t);
      return {meta:SEED.meta, tasks:merged};
    }
  }catch(e){ console.warn('本地数据读取失败，回退到内置数据', e); }
  return structuredClone(SEED);
}
function save(){
  localStorage.setItem(LS, JSON.stringify(state));
  document.getElementById('dirty').classList.add('on');
}
const nextId = () => Math.max(0, ...state.tasks.map(t=>t.id)) + 1;
const esc = s => String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const when = iso => { try{ return new Date(iso).toLocaleString('zh-CN',{hour12:false}); }catch{ return iso||''; } };

/* ---------- 渲染看板 ---------- */
function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const area = document.getElementById('fArea').value;
  const hit = t => (!q || (t.title+t.body+t.area).toLowerCase().includes(q)) && (!area || t.area===area);

  document.getElementById('board').innerHTML = COLS.map(col=>{
    const list = state.tasks.filter(t=>t.status===col.k);
    const shown = list.filter(hit);
    return `<section class="col" data-col="${col.k}">
      <div class="col-h">
        <span class="dot" style="background:${col.c}"></span>
        <span class="name">${col.name}</span>
        <span class="n">${shown.length}${shown.length!==list.length?` / ${list.length}`:''}</span>
      </div>
      <div class="col-b" data-drop="${col.k}">
        ${shown.map(cardHTML).join('') || '<div class="empty">—</div>'}
      </div>
    </section>`;
  }).join('');

  bindDnd();
  const total = state.tasks.length, done = state.tasks.filter(t=>t.status==='done').length;
  document.getElementById('meta').textContent =
    `${total} 个 Issue · 已完成 ${done} · 数据构建于 ${BUILT_AT ? when(BUILT_AT) : '—'}`;
}
function cardHTML(t){
  const nBot = (t.agentNotes||[]).length, nMine = (t.userComments||[]).length, nC = (t.commits||[]).length;
  return `<article class="card p-${t.priority}" draggable="true" data-id="${t.id}">
    <div class="id">#${t.id} · ${esc(t.area)}</div>
    <div class="t">${esc(t.title)}</div>
    <div class="m">
      <span class="chip">${PRIO_NAME[t.priority]||t.priority}</span>
      ${nBot?`<span class="chip">🤖 ${nBot}</span>`:''}
      ${nMine?`<span class="chip warn">💬 ${nMine}</span>`:''}
      ${nC?`<span class="chip">📝 ${nC}</span>`:''}
    </div>
  </article>`;
}

/* ---------- 拖拽 ---------- */
let dragId = null;
function bindDnd(){
  document.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('dragstart', e=>{
      dragId = +el.dataset.id; el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); dragId=null; });
    el.addEventListener('click', ()=> openTask(+el.dataset.id));
  });
  document.querySelectorAll('[data-drop]').forEach(zone=>{
    const col = zone.closest('.col');
    zone.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('over'); });
    zone.addEventListener('dragleave', ()=> col.classList.remove('over'));
    zone.addEventListener('drop', e=>{
      e.preventDefault(); col.classList.remove('over');
      const t = state.tasks.find(x=>x.id===dragId);
      if(t && t.status !== zone.dataset.drop){ t.status = zone.dataset.drop; save(); render(); }
    });
  });
}

const dlg = document.getElementById('dlg');
function openTask(id){

  if(!t) return;
  openId = id; pendingImgs = [];

  document.getElementById('dTitle').innerHTML = `<span style="color:var(--ink-3)">#${t.id}</span> ${esc(t.title)}`;

        <select id="eStatus">${COLS.map(c=>`<option value="${c.k}"${t.status===c.k?' selected':''}>${c.name}</option>`).join('')}</select>

      <label class="f">优先级
        <select id="ePrio">${Object.entries(PRIO_NAME).map(([k,v])=>`<option value="${k}"${t.priority===k?' selected':''}>${v}</option>`).join('')}</select>
      </label>
      <label class="f">模块
        <input type="text" id="eArea" value="${esc(t.area)}" style="width:130px">

    <div class="body-text">${esc(t.body)}</div>

    <div class="sec">

        : '<div class="empty">还没有 agent 记录。</div>'}
    </div>

    <div class="sec">
      <h3>改动记录</h3>
      ${(t.commits||[]).length
        ? t.commits.map(c=>`<div class="note"><div class="h"><b>${esc(c.ref||'—')}</b><span>${when(c.at)}</span></div><div class="c">${esc(c.message)}${(c.files||[]).length?'\n\n'+c.files.map(f=>'· '+f).join('\n'):''}</div></div>`).join('')
        : '<div class="empty">还没有改动。</div>'}
    </div>

    <div class="sec">

      <div id="mine">${renderMine(t)}</div>
      <textarea id="eNew" placeholder="写下你的反馈…（可直接 Ctrl/⌘+V 粘贴截图）"></textarea>
      <div class="drop" id="eDrop">把图片拖到这里，或粘贴截图</div>
      <div class="thumbs" id="eThumbs"></div>
      <button class="btn-primary" id="eSend">发送回复</button>
    </div>`;

  document.getElementById('dFoot').innerHTML = `
    <button class="btn-danger" id="aReject">打回（待回复）</button>
    <button class="btn-ok" id="aApprove">通过（已完成）</button>
    <span class="spacer"></span>
    <button id="aDel">删除</button>
    <button id="aSave">保存并关闭</button>`;

  wireDialog(t);
  if(!dlg.open) dlg.showModal();
}
function renderMine(t){
  if(!(t.userComments||[]).length) return '<div class="empty">还没有回复。</div>';
  return t.userComments.map((c,i)=>`<div class="note mine">
    <div class="h"><b>👤 我</b><span>${when(c.at)}</span><button class="del" data-del="${i}">删除</button></div>
    ${c.text?`<div class="c">${esc(c.text)}</div>`:''}
    ${(c.images||[]).map(src=>`<img src="${src}" alt="附图">`).join('')}
  </div>`).join('');
}

function wireDialog(t){
  const $ = id => document.getElementById(id);

  $('eStatus').onchange = e => { t.status = e.target.value; save(); render(); };
  $('ePrio').onchange   = e => { t.priority = e.target.value; save(); render(); };
  $('eArea').onchange   = e => { t.area = e.target.value.trim() || '未分类'; save(); refreshAreas(); render(); };

  // 图片：拖入 / 粘贴
  const drop = $('eDrop');
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); };
  $('eNew').onpaste = e => {
    const files = [...(e.clipboardData?.items||[])]
      .filter(i=>i.kind==='file' && i.type.startsWith('image/'))
      .map(i=>i.getAsFile()).filter(Boolean);
    if(files.length){ e.preventDefault(); addFiles(files); }
  };

  $('eSend').onclick = () => {
    const text = $('eNew').value.trim();
    if(!text && !pendingImgs.length) return;
    (t.userComments ||= []).push({at:new Date().toISOString(), text, images:[...pendingImgs]});
    pendingImgs = []; save();
    $('mine').innerHTML = renderMine(t); bindDel(t);
    $('eNew').value = ''; drawThumbs(); render();
  };

  bindDel(t);

  $('aReject').onclick  = () => { t.status='reply'; save(); render(); dlg.close(); };
  $('aApprove').onclick = () => { t.status='done';  save(); render(); dlg.close(); };
  $('aSave').onclick    = () => { save(); render(); dlg.close(); };
  $('aDel').onclick     = () => {
    if(!confirm(`删除 #${t.id}「${t.title}」？`)) return;
    state.tasks = state.tasks.filter(x=>x.id!==t.id); save(); render(); dlg.close();
  };

  function bindDel(task){
    document.querySelectorAll('[data-del]').forEach(b=>{
      b.onclick = () => {
        task.userComments.splice(+b.dataset.del,1); save();
        $('mine').innerHTML = renderMine(task); bindDel(task); render();
      };
    });
  }
  function addFiles(files){
    [...files].filter(f=>f.type.startsWith('image/')).forEach(f=>{
      const r = new FileReader();
      r.onload = ev => { pendingImgs.push(ev.target.result); drawThumbs(); };
      r.readAsDataURL(f);
    });
  }
  function drawThumbs(){
    $('eThumbs').innerHTML = pendingImgs.map((src,i)=>
      `<div class="thumb"><img src="${src}" alt=""><button data-rm="${i}">×</button></div>`).join('');
    document.querySelectorAll('[data-rm]').forEach(b=>{
      b.onclick = () => { pendingImgs.splice(+b.dataset.rm,1); drawThumbs(); };
    });
  }
}

document.getElementById('dClose').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if(e.target===dlg) dlg.close(); });
dlg.addEventListener('close', () => { openId=null; pendingImgs=[]; });

document.getElementById('fArea').onchange = render;

/* ---------- 管控日志 ----------
   这一节的数据只来自内置的 SEED.meta.decisions（管控方写的），不进 localStorage，
   所以用户在看板上的改动不会被它覆盖，导出再导入也不会丢。 */
function renderMgr(){
  const items = (SEED.meta && SEED.meta.decisions) || [];
  const box = document.getElementById('mgr');
  if(!items.length) return;
  box.hidden = false;
  document.getElementById('mgrN').textContent = `${items.length} 条 · 这一轮的分工和我替你做的决定`;
  document.getElementById('mgrB').innerHTML = items.map(d=>
    `<div class="mgr-i"><div class="h"><b>${esc(d.title)}</b><span>${when(d.at)}</span></div>` +
    `<div class="c">${esc(d.text)}</div></div>`).join('');
}

refreshAreas();
render();
renderMgr();
</script>
</body>
</html>
