# CoilCoil 手机遥控入口 —— 部署在 vps 的 openresty 站点配置。
#
# 服务器上的位置：
#   /opt/1panel/apps/openresty/openresty/conf/conf.d/coil.pierce.wzizai.com.conf
#
# Mac 通过 ssh 反向隧道把 7788 绑在这台机器的回环地址上，所以这个 server 块
# 是外部唯一能到达它的路径；应用自身还有配对码和设备凭证两道门禁。
server {
    listen 80;
    server_name coil.pierce.wzizai.com;

    # 证书续期走 webroot，这个 location 必须留着。
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name coil.pierce.wzizai.com;

    # openresty 跑在容器里，看不到 /etc/letsencrypt，所以证书由续期钩子
    # /etc/letsencrypt/renewal-hooks/deploy/coilcoil-openresty.sh 复制到这里。
    ssl_certificate /www/sites/coil.pierce.wzizai.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/coil.pierce.wzizai.com/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";

    location / {
        proxy_pass http://127.0.0.1:7788;
        proxy_http_version 1.1;

        # 少了这两行，承载所有实时更新的 WebSocket 会静默降级成普通请求，
        # 手机上看到的会话就再也不动了。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 应用据此把配对凭证标记为 Secure。
        proxy_set_header X-Forwarded-Proto https;

        # Agent 一个回合可能跑几分钟，短超时会把它拦腰截断。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
