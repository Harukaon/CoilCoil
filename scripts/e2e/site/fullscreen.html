<html><head><meta charset="utf-8"><title>fullscreen</title>
<style>body { margin: 0; font: 16px Arial, sans-serif; } #v { width: 200px; height: 120px; background: #3388aa; } #go { position: absolute; left: 20px; top: 160px; width: 140px; height: 40px; }</style>
</head><body>
<div id="v"></div>
<button id="go" aria-label="全屏播放">全屏播放</button>
<script>
window.log = [];
document.getElementById("go").addEventListener("click", () => document.getElementById("v").requestFullscreen().then(() => log.push("entered"), (error) => log.push("denied " + error.message)));
document.addEventListener("fullscreenchange", () => log.push(document.fullscreenElement ? "fs:on" : "fs:off"));
document.addEventListener("keydown", (event) => log.push("key:" + event.key));
</script>
</body></html>
