<html><head><meta charset="utf-8"><title>page-system</title></head><body style="margin:0">
<input id="f" type="file" aria-label="上传文件" style="position:absolute;left:20px;top:20px;width:240px;height:40px" onchange="document.title = 'file-' + this.files[0].name">
<button id="p" onclick="print(); document.title = 'printed-' + (++window.prints || (window.prints = 1))" style="position:absolute;left:20px;top:90px;width:120px;height:40px">打印</button>
</body></html>
