<html><head><meta charset="utf-8"><title>drag</title>
<style>
/* 都摆在 340 像素宽以内：测试窗口里面板窄，放不下的要先滚动，Agent 按下以后再滚动就拖不起来（Chrome 也一样）。 */
body { margin: 0; font: 14px Arial, sans-serif; }
#zone { position: absolute; left: 20px; top: 20px; width: 150px; height: 100px; background: #def; }
#picker { position: absolute; left: 190px; top: 40px; width: 140px; }
#a { position: absolute; left: 20px; top: 160px; width: 80px; height: 60px; background: #fd8; }
#b { position: absolute; left: 200px; top: 150px; width: 120px; height: 100px; background: #8df; }
#plain { position: absolute; left: 20px; top: 290px; }
</style></head><body>
<div id="zone">drop zone</div>
<input type="file" id="picker" aria-label="选文件" multiple>
<div id="a" draggable="true" role="button" aria-label="拖我">A</div>
<div id="b" role="button" aria-label="放这里">B</div>
<button id="plain" onclick="log.push('clicked')">普通按钮</button>
<script>
window.log = [];
const zone = document.getElementById("zone");
zone.addEventListener("dragenter", (e) => { e.preventDefault(); log.push("zone:dragenter:" + [...e.dataTransfer.types].join("|")); });
zone.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
zone.addEventListener("drop", async (e) => {
  e.preventDefault();
  const files = [...e.dataTransfer.files];
  log.push("zone:drop:" + files.map((f) => f.name).join(","));
  if (files[0]) log.push("zone:text:" + (await files[0].text()));
});
document.getElementById("picker").addEventListener("change", (e) => log.push("picker:" + [...e.target.files].map((f) => f.name).join(",")));
const a = document.getElementById("a"), b = document.getElementById("b");
a.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", "from-a"); log.push("a:dragstart"); });
a.addEventListener("dragend", (e) => log.push("a:dragend:" + e.dataTransfer.dropEffect));
b.addEventListener("dragenter", (e) => { e.preventDefault(); log.push("b:dragenter"); });
b.addEventListener("dragover", (e) => e.preventDefault());
b.addEventListener("drop", (e) => { e.preventDefault(); log.push("b:drop:" + e.dataTransfer.getData("text/plain")); });
</script></body></html>
