<html><head><meta charset="utf-8"><title>frames</title>
<style>body { margin: 0; } iframe { position: absolute; left: 20px; top: 30px; width: 300px; height: 220px; border: 4px solid #999; }</style>
</head><body>
<iframe id="f" title="付款表单"></iframe>
<script>
// 同一个测试服务器换成 127.0.0.1：和 localhost 不同站，内嵌页落在另一个进程里（和付款表单一样）。
document.getElementById("f").src = location.protocol + "//127.0.0.1:" + location.port + "/frame-inner.html";
</script>
</body></html>
