<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">AI Learning Platform 动态 Logo</title>
  <desc id="desc">由多个持续旋转和变形的三角形组成的黑色动态标志</desc>
  <style>
    #clipping {
      filter: contrast(15);
      animation: roundness 1s linear infinite;
    }
    #clipping polygon {
      filter: blur(12px);
    }
    #clipping polygon:nth-child(1) {
      transform-origin: 75% 25%;
      transform: rotate(90deg);
    }
    #clipping polygon:nth-child(2) {
      transform-origin: 50% 50%;
      animation: rotation 2s linear infinite reverse;
    }
    #clipping polygon:nth-child(3) {
      transform-origin: 50% 60%;
      animation: rotation 2s linear -0.6667s infinite;
    }
    #clipping polygon:nth-child(4) {
      transform-origin: 40% 40%;
      animation: rotation 2s linear infinite reverse;
    }
    #clipping polygon:nth-child(5) {
      transform-origin: 40% 40%;
      animation: rotation 2s linear -1s infinite reverse;
    }
    #clipping polygon:nth-child(6) {
      transform-origin: 60% 40%;
      animation: rotation 2s linear infinite;
    }
    #clipping polygon:nth-child(7) {
      transform-origin: 60% 40%;
      animation: rotation 2s linear -1.3333s infinite;
    }
    @keyframes rotation {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes roundness {
      0%, 60%, 100% { filter: contrast(15); }
      20%, 40% { filter: contrast(3); }
    }
  </style>
  <defs>
    <linearGradient id="logo-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="20%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#2a2a2a"/>
      <stop offset="80%" stop-color="#1a1a1a"/>
    </linearGradient>
    <mask id="clipping" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <polygon points="0,0 100,0 100,100 0,100" fill="black"/>
      <polygon points="25,25 75,25 50,75" fill="white"/>
      <polygon points="50,25 75,75 25,75" fill="white"/>
      <polygon points="35,35 65,35 50,65" fill="white"/>
      <polygon points="35,35 65,35 50,65" fill="white"/>
      <polygon points="35,35 65,35 50,65" fill="white"/>
      <polygon points="35,35 65,35 50,65" fill="white"/>
    </mask>
  </defs>
  <rect width="100" height="100" fill="url(#logo-gradient)" mask="url(#clipping)"/>
</svg>
